<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⏳ Gen Z Vibes Countdown</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #00ffe7;
      animation: fadeIn 1.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      animation: zoomIn 0.6s ease-out;
    }
    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    input, button {
      margin: 10px 0;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
    }
    button {
      background: linear-gradient(to right, #00ffd5, #00c8ff);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px #00ffd5aa;
    }
    .timer {
      font-size: 1.3rem;
      margin-top: 10px;
    }
    .complete {
      color: #00ff99;
      font-weight: bold;
      animation: pop 1s ease infinite alternate, flashBg 1.5s ease-in-out 3;
    }
    
    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    
    @keyframes flashBg {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(0, 255, 153, 0.2); }
    }
  </style>
</head>
<body>
  <h1>🔥 Gen Z Countdown Vibes 🔥</h1>
  <div class="container">
    <input type="text" id="eventTitle" placeholder="📅 Event Name">
    <input type="date" id="dateInput">
    <input type="time" id="timeInput">
    <button onclick="addCountdown()">➕ Add Countdown</button>
  </div>
  <div id="timers"></div>

  <!-- Link your custom sound (place in same folder as this HTML) -->
  
  <audio id="alarmSound" preload="auto">
    <source src="/countdown timer/audio/clap.m4a" type="audio/mp4">
    Your browser does not support the audio element.
  </audio>

  <script>
    const alarm = document.getElementById('alarmSound');

    function addCountdown() {
      const title = document.getElementById('eventTitle').value || "Unnamed Event";
      const date = document.getElementById('dateInput').value;
      const time = document.getElementById('timeInput').value;
      if (!date || !time) return alert("Please select date and time.");

      const target = new Date(`${date}T${time}`);
      if (target < new Date()) return alert("Please choose a future time.");

      const timersDiv = document.getElementById('timers');
      const timerEl = document.createElement('div');
      timerEl.className = 'container';
      timerEl.innerHTML = `<strong>${title}</strong><div class="timer">Loading...</div>`;
      timersDiv.appendChild(timerEl);

      const display = timerEl.querySelector('.timer');

      const interval = setInterval(() => {
        const now = new Date();
        const diff = target - now;
        if (diff <= 0) {
          clearInterval(interval);
          display.innerHTML = `<span class="complete">🎉 ${title.toUpperCase()} IS LIVE!</span>`;
          alarm.currentTime = 0;
          alarm.play();
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        display.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }, 1000);
    }
  </script>
</body>
</html>
